name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ziglang/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check src/ build.zig
      - run: zig build
      - run: zig build test
      - run: zig build example-basic
